  </defs>
  <circle cx="160" cy="160" r="152" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="152" fill="none" stroke="#e32b3c" stroke-width="5"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#262624" stroke-width="2"/>
  <!-- mask face -->
  <path d="M160 42 C108 42 76 88 76 148 C76 212 112 262 160 262 C208 262 244 212 244 148 C244 88 212 42 160 42 Z" fill="url(#face)"/>
  <!-- cheek shading -->
