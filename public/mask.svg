      <stop offset="0%" stop-color="#1c1c1a"/>
      <stop offset="100%" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2efeb"/>
      <stop offset="100%" stop-color="#cfc9bd"/>
